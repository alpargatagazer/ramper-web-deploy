name: ramper-web

services:

  web:
    image: ${RAMPER_IMAGE}
    container_name: ramper-web
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - orchestra

  proxy:
    image: ${CADDY_IMAGE}
    container_name: caddy-proxy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${WEB_PORT}:8123"
      - "${KUMA_PORT}:8124"
      - "${DOZZLE_PORT}:8125"
    environment:
      - TZ=${TZ}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${VOLUMES_PATH}/caddy_data:/data
      - ${VOLUMES_PATH}/caddy_config:/config
      - ${VOLUMES_PATH}/caddy_logs:/var/log/caddy
    networks:
      - orchestra

  uptime-kuma:
    image: ${UPTIME_KUMA_IMAGE}
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - ${VOLUMES_PATH}/uptime-kuma:/app/data
    environment:
      - TZ=${TZ}
    mem_limit: 256m
    networks:
      - orchestra

  dozzle:
    image: ${DOZZLE_IMAGE}
    container_name: dozzle
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DOZZLE_NO_ANALYTICS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - orchestra

networks:
  orchestra:
    name: ramper-web
    driver: bridge